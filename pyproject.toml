[project]
name = "pr-review-agent"
version = "0.1.0"
description = "GitHub PR review agent powered by Pydantic AI and Anthropic"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "logfire>=3.0",
    "pydantic-ai>=0.2.0",
    "pydantic-evals>=0.2.0",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_review_agent"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "evals"]
python_files = ["test_*.py", "eval_*.py"]
asyncio_mode = "auto"
markers = [
    "integration: hits real external APIs (deselect with '-m not integration')",
    "evals: runs pydantic-evals suites against real Anthropic API",
]
addopts = "-m 'not integration and not evals'"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.15.9",
    "ty>=0.0.28",
]
